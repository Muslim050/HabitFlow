<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap">
  <style>
    body { margin: 0; background: #FBFAF7; }
    .grotesk { font-family: "Space Grotesk", "Helvetica Neue", Arial, sans-serif; }
    a { color: #1B1B1F; } a:hover { color: #000000; }
  </style>
</helmet>

<div style="width: 390px; height: 844px; background: #FBFAF7; color: #1B1B1F; display: flex; flex-direction: column; overflow: hidden;">
  <div style="height: 59px; flex-shrink: 0;"></div>

  <div style="padding: 10px 24px 0; display: flex; align-items: center; justify-content: space-between; flex-shrink: 0;">
    <div class="grotesk" style="font-size: 13px; font-weight: 500; letter-spacing: 0.4px; color: #6B6B72; text-transform: uppercase;">Чт, 12 сент</div>
    <div style="width: 34px; height: 34px; border-radius: 999px; background: #1B1B1F; display: flex; align-items: center; justify-content: center;">
      <svg width="15" height="15" viewBox="0 0 18 18" fill="none" stroke="#FBFAF7" stroke-width="2" stroke-linecap="round"><path d="M9 3 V15 M3 9 H15"></path></svg>
    </div>
  </div>

  <div style="display: flex; justify-content: center; padding: 6px 0 0; flex-shrink: 0; position: relative;">
    <svg width="260" height="260" viewBox="0 0 260 260" style="transform: rotate(-90deg);">
        <circle cx="130" cy="130" r="100.0" fill="none" stroke="#4F8EF7" stroke-width="16" opacity="0.16"></circle>
        <circle cx="130" cy="130" r="100.0" fill="none" stroke="#4F8EF7" stroke-width="16" stroke-linecap="round" stroke-dasharray="490.09 628.32"></circle>
        <circle cx="130" cy="130" r="72.0" fill="none" stroke="#AF52DE" stroke-width="16" opacity="0.16"></circle>
        <circle cx="130" cy="130" r="72.0" fill="none" stroke="#AF52DE" stroke-width="16" stroke-linecap="round"></circle>
        <circle cx="130" cy="130" r="44.0" fill="none" stroke="#FF9500" stroke-width="16" opacity="0.16"></circle>
        <circle cx="130" cy="130" r="44.0" fill="none" stroke="#FF9500" stroke-width="16" stroke-linecap="round" stroke-dasharray="74.64 276.46"></circle>
    </svg>
    <div style="position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 0;">
      <div class="grotesk" style="font-size: 46px; font-weight: 700; letter-spacing: -2px; line-height: 46px;">2/4</div>
      <div class="grotesk" style="font-size: 12px; font-weight: 500; color: #6B6B72; letter-spacing: 0.3px;">закрыто само</div>
    </div>
  </div>

  <div style="padding: 18px 20px 0; display: flex; flex-direction: column; gap: 10px; flex-grow: 1;">
    <div style="display: flex; align-items: center; gap: 14px; background: #4F8EF71A; border-radius: 20px; padding: 14px 16px;">
        <div style="width: 42px; height: 42px; border-radius: 999px; background: #4F8EF7; display: flex; align-items: center; justify-content: center; font-size: 20px; flex-shrink: 0;">🚶</div>
        <div style="display: flex; flex-direction: column; gap: 1px; flex-grow: 1; min-width: 0;">
          <div class="grotesk" style="font-size: 17px; font-weight: 700; letter-spacing: -0.3px; color: #1B1B1F;">Прогулка</div>
          <div class="grotesk" style="font-size: 12px; font-weight: 400; color: #6B6B72; font-variant-numeric: tabular-nums;">6 231 / 8 000 шагов · Здоровье</div>
        </div>
        <div class="grotesk" style="font-size: 15px; font-weight: 700; color: #4F8EF7; font-variant-numeric: tabular-nums;">78%</div>
      </div>
    <div style="display: flex; align-items: center; gap: 14px; background: #AF52DE1A; border-radius: 20px; padding: 14px 16px;">
        <div style="width: 42px; height: 42px; border-radius: 999px; background: #AF52DE; display: flex; align-items: center; justify-content: center; font-size: 20px; flex-shrink: 0;">😴</div>
        <div style="display: flex; flex-direction: column; gap: 1px; flex-grow: 1; min-width: 0;">
          <div class="grotesk" style="font-size: 17px; font-weight: 700; letter-spacing: -0.3px; color: #1B1B1F;">Сон</div>
          <div class="grotesk" style="font-size: 12px; font-weight: 400; color: #6B6B72; font-variant-numeric: tabular-nums;">7,5 / 7 ч · Здоровье</div>
        </div>
        <div class="grotesk" style="font-size: 15px; font-weight: 700; color: #AF52DE; font-variant-numeric: tabular-nums;">Готово</div>
      </div>
    <div style="display: flex; align-items: center; gap: 14px; background: #FF95001A; border-radius: 20px; padding: 14px 16px;">
        <div style="width: 42px; height: 42px; border-radius: 999px; background: #FF9500; display: flex; align-items: center; justify-content: center; font-size: 20px; flex-shrink: 0;">🏋️</div>
        <div style="display: flex; flex-direction: column; gap: 1px; flex-grow: 1; min-width: 0;">
          <div class="grotesk" style="font-size: 17px; font-weight: 700; letter-spacing: -0.3px; color: #1B1B1F;">Зал</div>
          <div class="grotesk" style="font-size: 12px; font-weight: 400; color: #6B6B72; font-variant-numeric: tabular-nums;">12 / 45 мин · Геолокация</div>
        </div>
        <div class="grotesk" style="font-size: 15px; font-weight: 700; color: #FF9500; font-variant-numeric: tabular-nums;">27%</div>
      </div>
    <div style="display: flex; align-items: center; gap: 14px; background: #34C7591A; border-radius: 20px; padding: 14px 16px;">
        <div style="width: 42px; height: 42px; border-radius: 999px; background: #34C759; display: flex; align-items: center; justify-content: center; font-size: 20px; flex-shrink: 0;">📚</div>
        <div style="display: flex; flex-direction: column; gap: 1px; flex-grow: 1; min-width: 0;">
          <div class="grotesk" style="font-size: 17px; font-weight: 700; letter-spacing: -0.3px; color: #1B1B1F;">Чтение</div>
          <div class="grotesk" style="font-size: 12px; font-weight: 400; color: #6B6B72; font-variant-numeric: tabular-nums;">Отмечено вручную</div>
        </div>
        <div class="grotesk" style="font-size: 15px; font-weight: 700; color: #34C759; font-variant-numeric: tabular-nums;">Готово</div>
      </div>
  </div>

  <div style="flex-shrink: 0; padding: 0 20px;">
    <div style="background: #1B1B1F; border-radius: 22px; height: 56px; display: flex; align-items: center; justify-content: space-around; padding: 0 8px;">
      <div class="grotesk" style="font-size: 13px; font-weight: 700; color: #FBFAF7; background: #33333A; border-radius: 14px; padding: 7px 16px;">Сегодня</div>
      <div class="grotesk" style="font-size: 13px; font-weight: 500; color: #8A8A93;">Инсайты</div>
      <div class="grotesk" style="font-size: 13px; font-weight: 500; color: #8A8A93;">Настройки</div>
    </div>
    <div style="height: 30px;"></div>
  </div>
</div>
</x-dc>
</body>
</html>
