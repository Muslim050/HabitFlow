<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    body { margin: 0; font-family: -apple-system, "SF Pro Text", "Helvetica Neue", Arial, sans-serif; -webkit-font-smoothing: antialiased; }
    a { color: #4F8EF7; } a:hover { color: #3A6FD8; }
    .sf { font-family: -apple-system, "SF Pro Text", "Helvetica Neue", Arial, sans-serif; }
  </style>
</helmet>

<div style="width: 390px; height: 844px; background: #F2F2F7; color: #000000; display: flex; flex-direction: column; overflow: hidden;">

  <!-- safe area: the real status bar paints here -->
  <div style="height: 59px; flex-shrink: 0;"></div>

  <!-- nav bar -->
  <div style="display: flex; align-items: center; justify-content: flex-end; padding: 0 20px; height: 44px; flex-shrink: 0;">
    <svg width="22" height="22" viewBox="0 0 22 22" fill="none" style="stroke: {{accent}}; stroke-width: 2; stroke-linecap: round;">
      <path d="M11 4.5 V17.5 M4.5 11 H17.5"></path>
    </svg>
  </div>
  <div style="padding: 0 20px 8px; flex-shrink: 0;">
    <div style="font-size: 34px; line-height: 41px; font-weight: 700; letter-spacing: 0.37px;">Сегодня</div>
  </div>

  <div style="flex-grow: 1; overflow: hidden; display: flex; flex-direction: column; gap: 0;">

    <!-- summary card -->
    <div style="margin: 12px 20px 0; background: #FFFFFF; border-radius: 10px; padding: 12px 16px; display: flex; align-items: center; gap: 16px;">
      <div style="width: 64px; height: 64px; position: relative; flex-shrink: 0;">
        <svg width="72" height="72" viewBox="0 0 72 72" style="transform: rotate(-90deg); position: absolute; left: -4px; top: -4px;">
          <circle cx="36" cy="36" r="32" fill="none" stroke-width="8" style="stroke: {{accent}}; opacity: 0.18;"></circle>
          <circle cx="36" cy="36" r="32" fill="none" stroke-width="8" stroke-linecap="round" stroke-dasharray="100.53 201.06" style="stroke: {{accent}};"></circle>

      </div>
      <div style="display: flex; flex-direction: column; gap: 4px;">
        <div style="font-size: 17px; line-height: 22px; font-weight: 600;">Осталось 2</div>
        <div style="font-size: 13px; line-height: 18px; color: rgba(60, 60, 67, 0.6);">Авто-проверка была 3 мин назад</div>
      </div>
    </div>

    <!-- section header -->
    <div style="padding: 24px 20px 6px 36px; font-size: 13px; line-height: 18px; color: rgba(60, 60, 67, 0.6); text-transform: uppercase; letter-spacing: -0.08px;">Привычки</div>

    <!-- habits card -->
    <div style="margin: 0 20px; background: #FFFFFF; border-radius: 10px; overflow: hidden;">

      <!-- row: steps, in progress, auto -->
      <div style="display: flex; align-items: center; gap: 14px; padding: 10px 16px 10px 16px;">
        <div style="width: 44px; height: 44px; position: relative; flex-shrink: 0;">
          <svg width="48" height="48" viewBox="0 0 48 48" style="transform: rotate(-90deg); position: absolute; left: -2px; top: -2px;">

            <circle cx="24" cy="24" r="22" fill="none" stroke="#4F8EF7" stroke-width="4" stroke-linecap="round" stroke-dasharray="107.82 138.23"></circle>
          </svg>
          <div style="position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 20px;">🚶</div>

        <div style="display: flex; flex-direction: column; gap: 3px; flex-grow: 1; min-width: 0;">
          <div style="font-size: 17px; line-height: 22px; font-weight: 500;">Прогулка</div>
          <div style="display: flex; align-items: center; gap: 6px;">
            <div style="font-size: 13px; line-height: 18px; color: rgba(60, 60, 67, 0.6); font-variant-numeric: tabular-nums;">6 231 / 8 000 шагов</div>

        </div>
        <svg width="22" height="22" viewBox="0 0 22 22" fill="none" style="flex-shrink: 0;"><circle cx="11" cy="11" r="10" stroke="rgba(60,60,67,0.6)" stroke-width="1.5"></circle></svg>

      <!-- row: sleep, completed, auto -->

        <div style="width: 44px; height: 44px; position: relative; flex-shrink: 0;">
          <svg width="48" height="48" viewBox="0 0 48 48" style="transform: rotate(-90deg); position: absolute; left: -2px; top: -2px;">
            <circle cx="24" cy="24" r="22" fill="none" stroke="#AF52DE" stroke-width="4" opacity="0.18"></circle>
            <circle cx="24" cy="24" r="22" fill="none" stroke="#AF52DE" stroke-width="4" stroke-linecap="round"></circle>
          </svg>
          <div style="position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 20px;">😴</div>
        </div>
        <div style="display: flex; flex-direction: column; gap: 3px; flex-grow: 1; min-width: 0;">
          <div style="font-size: 17px; line-height: 22px; font-weight: 500; color: rgba(60, 60, 67, 0.6); text-decoration: line-through;">Сон</div>
          <div style="display: flex; align-items: center; gap: 6px;">
            <div style="font-size: 13px; line-height: 18px; color: rgba(60, 60, 67, 0.6); font-variant-numeric: tabular-nums;">7,5 / 7 ч</div>
            <div style="display: flex; align-items: center; gap: 3px; background: rgba(175, 82, 222, 0.12); color: #AF52DE; border-radius: 999px; padding: 2px 6px; font-size: 11px; font-weight: 600;">
              <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="#AF52DE" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17v-5h18v5M3 12V7m0 10v2m18-2v2M7 12a2 2 0 1 1 4 0"></path></svg>
              <span>Здоровье</span>

          </div>
        </div>
        <svg width="22" height="22" viewBox="0 0 22 22" fill="none" style="flex-shrink: 0;"><circle cx="11" cy="11" r="11" fill="#AF52DE"></circle><path d="M6 11.3 L9.5 14.8 L16 8" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></svg>
        <svg width="8" height="13" viewBox="0 0 8 13" fill="none" style="flex-shrink: 0;"><path d="M1.5 1.5 L6.5 6.5 L1.5 11.5" stroke="rgba(60,60,67,0.3)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></svg>
      </div>
      <div style="height: 0.5px; background: rgba(60, 60, 67, 0.29); margin-left: 16px;"></div>

      <!-- row: gym, in progress, location -->
      <div style="display: flex; align-items: center; gap: 14px; padding: 10px 16px;">
        <div style="width: 44px; height: 44px; position: relative; flex-shrink: 0;">
          <svg width="48" height="48" viewBox="0 0 48 48" style="transform: rotate(-90deg); position: absolute; left: -2px; top: -2px;">
            <circle cx="24" cy="24" r="22" fill="none" stroke="#FF9500" stroke-width="4" opacity="0.18"></circle>
            <circle cx="24" cy="24" r="22" fill="none" stroke="#FF9500" stroke-width="4" stroke-linecap="round" stroke-dasharray="37.32 138.23"></circle>
          </svg>
          <div style="position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 20px;">🏋️</div>
        </div>
        <div style="display: flex; flex-direction: column; gap: 3px; flex-grow: 1; min-width: 0;">
          <div style="font-size: 17px; line-height: 22px; font-weight: 500;">Зал</div>
          <div style="display: flex; align-items: center; gap: 6px;">
            <div style="font-size: 13px; line-height: 18px; color: rgba(60, 60, 67, 0.6); font-variant-numeric: tabular-nums;">12 / 45 мин</div>
            <div style="display: flex; align-items: center; gap: 3px; background: rgba(255, 149, 0, 0.12); color: #FF9500; border-radius: 999px; padding: 2px 6px; font-size: 11px; font-weight: 600;">
              <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="#FF9500" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s7-6.2 7-11a7 7 0 1 0-14 0c0 4.8 7 11 7 11Z"></path><circle cx="12" cy="10" r="2.5"></circle></svg>
              <span>Геолокация</span>
            </div>
          </div>
        </div>
        <svg width="22" height="22" viewBox="0 0 22 22" fill="none" style="flex-shrink: 0;"><circle cx="11" cy="11" r="10" stroke="rgba(60,60,67,0.6)" stroke-width="1.5"></circle></svg>
        <svg width="8" height="13" viewBox="0 0 8 13" fill="none" style="flex-shrink: 0;"><path d="M1.5 1.5 L6.5 6.5 L1.5 11.5" stroke="rgba(60,60,67,0.3)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></svg>
      </div>
      <div style="height: 0.5px; background: rgba(60, 60, 67, 0.29); margin-left: 16px;"></div>

      <!-- row: manual -->
      <div style="display: flex; align-items: center; gap: 14px; padding: 10px 16px;">
        <div style="width: 44px; height: 44px; position: relative; flex-shrink: 0;">
          <svg width="48" height="48" viewBox="0 0 48 48" style="transform: rotate(-90deg); position: absolute; left: -2px; top: -2px;">
            <circle cx="24" cy="24" r="22" fill="none" stroke="#34C759" stroke-width="4" opacity="0.18"></circle>
            <circle cx="24" cy="24" r="22" fill="none" stroke="#34C759" stroke-width="4" stroke-linecap="round"></circle>
          </svg>
          <div style="position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 20px;">📚</div>
        </div>
        <div style="display: flex; flex-direction: column; gap: 3px; flex-grow: 1; min-width: 0;">
          <div style="font-size: 17px; line-height: 22px; font-weight: 500; color: rgba(60, 60, 67, 0.6); text-decoration: line-through;">Чтение</div>
          <div style="font-size: 13px; line-height: 18px; color: rgba(60, 60, 67, 0.6);">Готово</div>
        </div>
        <svg width="22" height="22" viewBox="0 0 22 22" fill="none" style="flex-shrink: 0;"><circle cx="11" cy="11" r="11" fill="#34C759"></circle><path d="M6 11.3 L9.5 14.8 L16 8" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></svg>
        <svg width="8" height="13" viewBox="0 0 8 13" fill="none" style="flex-shrink: 0;"><path d="M1.5 1.5 L6.5 6.5 L1.5 11.5" stroke="rgba(60,60,67,0.3)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></svg>
      </div>

    </div>
  </div>

  <!-- tab bar -->
  <div style="flex-shrink: 0; background: rgba(249, 249, 249, 0.94); border-top: 0.5px solid rgba(60, 60, 67, 0.29);">
    <div style="height: 49px; display: flex; align-items: center;">
      <div style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; gap: 2px;">
        <svg width="25" height="25" viewBox="0 0 24 24" fill="none" style="stroke: {{accent}}; stroke-width: 1.8;"><circle cx="12" cy="12" r="9"></circle><circle cx="12" cy="12" r="3.6" style="fill: {{accent}}; stroke: none;"></circle></svg>
        <div style="font-size: 10px; font-weight: 500; color: {{accent}};">Сегодня</div>
      </div>
      <div style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; gap: 2px;">
        <svg width="25" height="25" viewBox="0 0 24 24" fill="none" stroke="#8E8E93" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17.5 L9 11 L13 15 L21 6.5"></path><path d="M21 11 V6.5 H16.5"></path></svg>
        <div style="font-size: 10px; font-weight: 500; color: #8E8E93;">Инсайты</div>
      </div>
      <div style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; gap: 2px;">
        <svg width="25" height="25" viewBox="0 0 24 24" fill="none" stroke="#8E8E93" stroke-width="1.8"><circle cx="12" cy="12" r="3.2"></circle><path d="M12 3.2v2.4M12 18.4v2.4M20.8 12h-2.4M5.6 12H3.2M18.2 5.8l-1.7 1.7M7.5 16.5l-1.7 1.7M18.2 18.2l-1.7-1.7M7.5 7.5 5.8 5.8"></path></svg>
        <div style="font-size: 10px; font-weight: 500; color: #8E8E93;">Настройки</div>
      </div>
    </div>
    <!-- home indicator area: the real one paints here -->
    <div style="height: 34px;"></div>
  </div>

</div>
</x-dc>
<script data-dc-script data-props='{"accent":{"editor":"color","default":"#4F8EF7","options":["#4F8EF7","#34C759","#FF9500","#AF52DE"]}}'>
class Component extends DCLogic {
  renderVals() {
    return { accent: this.props.accent ?? '#4F8EF7' };
  }
}
</script>
</body>
</html>
